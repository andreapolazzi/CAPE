{% extends "master.html" %}

<style>
  .box {
      display: flex;
      align-items: flex-start;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: transparent;
      transition: background-color 0.3s ease;
      margin-bottom: 10px;
      cursor: pointer;
      position: relative;
  }

  /* Nasconde la checkbox */
  .box input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
  }

  .box .content {
      flex-grow: 1;
      padding: 5px;
      border-radius: 5px;
  }

  /* Card evidenziata se checkbox è checked */
  .box input[type="checkbox"]:checked + .content {
      background-color: #e0f2f7;
      border: 2px solid #a7d9ee;
  }

  button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
  }

  button:hover {
      background-color: #0056b3;
  }
</style>

{% block title %}BACMAN- pathways{% endblock %}


{% block content %}
<h1>Recontruction of pathways</h1>
<h2>Best 3 pathways found from {{ pollutant }} to {{ sink }}</h2>

<form method="POST" action="{% url 'orthologs' %}">
    {% csrf_token %}

    <label class="box">
        <input type="checkbox" name="selected_pathway" value="0">
        <div class="content">{{ first_path|safe }}</div>
    </label>

    <label class="box">
        <input type="checkbox" name="selected_pathway" value="1">
        <div class="content">{{ second_path|safe }}</div>
    </label>

    <label class="box">
        <input type="checkbox" name="selected_pathway" value="2">
        <div class="content">{{ third_path|safe }}</div>
    </label>

    <button type="submit">Confirm</button>
</form>
    
{% endblock %}

<script>
  const boxes = document.querySelectorAll('.box');

  boxes.forEach((box) => {
      const checkbox = box.querySelector('input[type="checkbox"]');

      box.addEventListener('click', () => {
          if (checkbox.checked) {
              checkbox.checked = false; // deseleziona se già selezionata
          } else {
              document.querySelectorAll('input[type="checkbox"][name="selected_pathway"]').forEach(cb => {
                  cb.checked = false; // deseleziona tutte
              });
              checkbox.checked = true; // seleziona quella cliccata
          }
      });
  });
</script>
