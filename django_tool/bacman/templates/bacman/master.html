{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="website icon" type="png" href="{% static 'images/bacman_logo.png' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color:#e9e3f5a0;
;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }

        /* Header */
        header {
            margin-top: -10px;
            z-index: 2;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            background-color: #2d1d4b;
            color: white;
            padding: 20px 0;
            position: relative;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 90px;
            margin-right: 15px;
        }

        .logo h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: white;
        }

        .login-btn {
            background-color: #e9e3f5;
            color: #2d1d4b;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Navigation */
        nav {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: flex-end;
            background-color: #2d1d4b;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin-left: 10px;
            font-size: 1.1rem;
        }

        /* Banner Image */
        .banner-image {
            width: 100%;
            height: 350px;
            background-image: url('static/images/group_photo.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            margin-top: -20px;
            z-index: 1;
        }

        /* Main Content - Home */
        .main-content {
            background-color: white;
            padding: 40px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            margin-top: -50px;
            position: relative;
            z-index: 2;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .tool-section h2 {
            color: #2d1d4b;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .tool-controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .input-field {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            max-width: 400px;
        }

        .create-btn {
            background-color: #e9e3f5;
            color: #2d1d4b;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 20px;
        }

        .info-section {
            margin-top: 60px;
        }

        .info-section h2 {
            color: #2d1d4b;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .info-section p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        /* Help Section */
        .tool-title {
            font-size: 28px;
            color: #2d1a45;
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .button-container {
            display: flex;
            justify-content: flex-end;
        }
        
        .create-button {
            background-color: #e2d1f9;
            color: #2d1a45;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .description {
            margin-top: 50px;
        }
        
        .description h2 {
            color: #2d1a45;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .description p {
            line-height: 1.6;
            color: #333;
        }


        /* About Section */
        .about-section {
            background-color: #f9f9f9;
            padding: 50px 0;
            border-top: 1px solid #eee;
        }
        
        .section-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .section-title {
            color: #2d1a45;
            font-size: 28px;
            margin-bottom: 20px;
            position: relative;
            padding-left: 20px;
        }
        
        .section-title::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: #2d1a45;
        }
        
        .about-text {
            line-height: 1.6;
            color: #333;
            font-size: 16px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }
        
        .footer-section {
            flex: 1;
            margin-right: 30px;
        }
        
        .footer-title {
            color: #2d1a45;
            font-size: 24px;
            margin-bottom: 25px;
            position: relative;
            padding-left: 20px;
        }
        
        .footer-title::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: #2d1a45;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .contact-item {
            display: flex;
            align-items: flex-start;
        }
        
        .contact-icon {
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            font-size: 18px;
            color: #2d1a45;
            margin-right: 15px;
            min-width: 20px;
        }
        
        .contact-details {
            font-size: 14px;
        }
        
        .contact-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .contact-link {
            color: #9c6aff;
            text-decoration: none;
        }
        
        .contact-link:hover {
            text-decoration: underline;
        }
        
        .contact-phone {
            color: #9c6aff;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }
        
        .social-icon {
            font-family: 'Font Awesome 5 Brands';
            font-size: 20px;
            color: #2d1a45;
            width: 30px;
            height: 30px;
            background-color: #f2f2f2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
        }
        
        .social-name {
            font-size: 16px;
        }
        
        .donation-section {
            max-width: 900px;
            margin: 50px auto 0;
            padding: 0 20px;
        }
        
        .donation-text {
            line-height: 1.6;
            font-size: 16px;
            margin-top: 10px;
        }
        
        .donate-link {
            color: #9c6aff;
            text-decoration: none;
        }
        
        .donate-link:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #2d1d4b;
            color: white;
            margin-top: 40px;
            z-index: 2;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            padding: 30px 0;
            position: relative;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .footer-links {
            display: flex;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            margin-right: 30px;
            font-size: 1.1rem;
        }

        .social-icons {
            display: flex;
        }

        .social-icons a {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
        }

        .social-icons img {
            width: 20px;
            height: 20px;
        }

        .donate-btn {
            background-color: white;
            color: #2d1d4b;
            padding: 10px 30px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }

        .copyright {
            color: #aaa;
            font-size: 0.8rem;
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="{% static 'images/bacman_logo.png' %}">
                <h1>BACMAN</h1>
            </div>
            <a href="#" class="login-btn">Login</a>
        </div>
        <nav>
            <a href="{% url 'homepage' %}">Home</a>
            <a href="{% url 'help' %}">Help</a>
            <a href="{% url 'contact' %}">Contact Us</a>
        </nav>
    </header>
    {% block banner %}
    <div class="banner-image">
        <!-- Background image of bacteria/molecules is applied via CSS -->
    </div> {% endblock %}

    <div class="container">{% block content %}{% endblock %}  </div>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="{% url 'homepage' %}">Home</a>
                <a href="{% url 'help' %}">Help</a>
                <a href="{% url 'contact' %}">Contact Us</a>
            </div>
            <div class="social-icons">
                <a href="#"><img src="{% static 'images/insta_logo.png' %}" alt="Instagram"></a>
                <a href="#"><img src="{% static 'images/linkedin_logo.png' %}" alt="LinkedIn"></a>
                <a href="#"><img src="{% static 'images/gmail_logo.png' %}" alt="Gmail"></a>
                <a href="#"><img src="{% static 'images/youtube_logo.png' %}" alt="Youtube"></a>
            </div>
            <button class="donate-btn">DONA ORA</button>
        </div>
        <div class="footer-content">
            <div></div>
            <div class="copyright">© copyrights ajsodwoefmomwhf</div>
        </div>

    </footer>
</body>
</html>
