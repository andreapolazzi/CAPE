name: selenzymeRF
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- core, matching your working env ----
  - python=3.10.18
  - rdkit=2022.09.5
  - pandas=1.5.3
  - numpy=1.24.4
  - scipy=1.10.1
  - scikit-learn=1.2.2
  - networkx=3.1
  - biopython=1.81
  - requests=2.32.5
  - joblib=1.3.2
  - tqdm=4.67.1
  # external binary used by selenzy.py (pepstats)
  - emboss=6.6.0
  # web bits you already have
  - flask=2.2.5
  - werkzeug=3.1.3
  # allow pip installs
  - pip
  - pip:
      # match your env exactly
      - rxnmapper==0.4.2
      - rxn-chem-utils==1.6.0
      - rxn-utils==2.0.0
      - transformers==4.38.2
      - tokenizers==0.15.2
      - sentencepiece==0.2.0
      # torch (CPU) is installed after env creation (see setup script)